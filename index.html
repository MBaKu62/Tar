<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compteur de Tir TAR</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff99">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div class="container">
  <h1>Compteur de Tir TAR</h1>
  
  <!-- Message d'erreur -->
  <div id="message"></div>

  <!-- Ajout Tireur -->
  <div class="add-tireur-zone">
    <input type="text" id="tireur-name" placeholder="Nom du tireur">
    <button id="add-tireur-btn">Ajouter</button>
  </div>

  <!-- Liste Tireurs -->
  <ul class="tireurs-list" id="tireurs-ul"></ul>

  <!-- Onglets séries -->
  <div class="tabs" id="series-tabs"></div>

  <!-- Gongs -->
  <div class="gongs-container" id="gong-container"></div>

  <!-- Timer -->
  <div class="timer-container">
    <span class="tireur-selected" id="timer-tireur">Aucun tireur</span>
    <div class="timer-wrapper">
      <div class="timer-bar"></div>
      <div class="timer-text" id="timer-display">0s</div>
    </div>
    <button class="start-btn" id="start-btn">Démarrer</button>
    <button class="start-btn" id="export-pdf-btn">Exporter PDF</button>
  </div>

  <!-- Tableau des scores -->
  <div class="table-wrapper">
    <table id="score-table">
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Historique -->
  <h2>Historique</h2>
  <div id="history-container"></div>
</div>

<script src="script.js"></script>
</body>
</html>
