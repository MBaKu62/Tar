<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compteur de Tir - TAR</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div class="container">
  <h1>Compteur de Tir - TAR</h1>

  <!-- Navigation onglets -->
  <div class="main-tabs">
    <button class="main-tab active" data-target="tir">Tir</button>
    <button class="main-tab" data-target="series">Gestion Séries</button>
    <button class="main-tab" data-target="history">Historique</button>
  </div>

  <!-- SECTION TIR -->
  <div class="tab-content active" id="tir">
    <!-- Ajout Tireur -->
    <div class="add-tireur-zone">
      <input type="text" id="tireur-name" placeholder="Nom du tireur">
      <button id="add-tireur-btn">Ajouter</button>
    </div>

    <!-- Liste Tireurs -->
    <ul class="tireurs-list" id="tireurs-ul"></ul>

    <!-- Onglets séries -->
    <div class="tabs" id="series-tabs"></div>

    <!-- Gongs -->
    <div class="gongs-container" id="gong-container"></div>

    <!-- Timer -->
    <div class="timer-container">
      <span class="tireur-selected" id="timer-tireur">Aucun tireur</span>
      <div class="timer-wrapper">
        <div class="timer-bar"></div>
        <div class="timer-text" id="timer-display">0s</div>
      </div>
      <button class="start-btn" id="start-btn">Démarrer</button>
      <button class="start-btn" id="save-session-btn">Enregistrer Session</button>
      <button class="start-btn" id="export-pdf-btn">Exporter PDF</button>
      <button class="start-btn" id="export-csv-btn">Exporter CSV</button>
    </div>

    <!-- Tableau des scores -->
    <table id="score-table">
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>

    <!-- Graphique évolution -->
    <canvas id="score-chart" width="800" height="250"></canvas>
  </div>

  <!-- SECTION GESTION SERIES -->
  <div class="tab-content" id="series">
    <h2>Gestion des Séries</h2>
    <div id="series-list"></div>
    <button class="start-btn" id="add-series-btn">Ajouter Série</button>
  </div>

  <!-- SECTION HISTORIQUE -->
  <div class="tab-content" id="history">
    <h2>Historique des Sessions</h2>
    <table id="history-table">
      <thead>
        <tr>
          <th>Date/Heure</th>
          <th>Tireur</th>
          <th>Série</th>
          <th>Score</th>
          <th>% Touché</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="start-btn" id="export-history-pdf">Exporter PDF</button>
    <button class="start-btn" id="export-history-csv">Exporter CSV</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
